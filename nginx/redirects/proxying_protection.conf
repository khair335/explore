location = /hc {

  proxy_set_header Host $http_host;
  add_header ETag on;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect off;
  proxy_buffering off;
  proxy_hide_header X-Powered-By;
  server_tokens off;
  proxy_pass http://cmsgatewayapp;
  include /etc/nginx/redirects/general-security-header.conf;
}




location ~ ^/(gallery|api) {

  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;
  server_tokens off;

  if_modified_since off;
  add_header  Last-Modified  "";
  expires off;
  proxy_hide_header etag;
  #etag off;
  add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  proxy_hide_header expires;

  include /etc/nginx/redirects/general-security-header.conf;

  location ~ ^/api/navigation {

    proxy_hide_header x-cache-status;
    include /etc/nginx/redirects/general-security-header.conf;
    #include /etc/nginx/redirects/proxying_api_nav_cache.conf;
    #include /etc/nginx/redirects/proxying_api_nav_cache.conf;
    break;

  }

  location ~ ^/api/getmetadata {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_metadata_cache.conf;
    #include /etc/nginx/redirects/proxying_api.conf;
    break;

  }

  location ~ ^/api/v2/getpubdate {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_metadata_cache.conf;
    #include /etc/nginx/redirects/proxying_api.conf;
    break;

  }

   location ~ ^/api/v2/getmetadata {

    include /etc/nginx/redirects/general-security-header.conf;
    #include /etc/nginx/redirects/proxying_api.conf;
    include /etc/nginx/redirects/proxying_api_metadata_cache.conf;
    break;

  }

   location ~ ^/api/getjsonbyurl {

    set $nocache 0;
    proxy_hide_header expires;
    if ($query_string ~ "mybroadcom"){
        set $nocache 1;
    }

    if ($query_string !~ "mybroadcom"){
        set $nocache 0;
    }

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api.conf;
    break;

  }
  location ~ ^/api/service {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;
    break;

  }

  location ~ ^/api/news {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;
    break;

  }



 location ~ ^/api/ {
    set $nocache 0;
    if ($query_string ~ "mybroadcom"){
        set $nocache 1;
    }

    if ($query_string !~ "mybroadcom"){
        set $nocache 0;
    }

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;
  }

}

