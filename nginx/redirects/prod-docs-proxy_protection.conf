location /api {

  proxy_cache_bypass $cookie_BRCMWASSOCookie;
  proxy_cache_bypass $cookie_BRCMAuthHeader;
  proxy_cache_bypass $cookie_BRCMportalCookie;
  proxy_cache_key $host$uri$is_args$args;
  proxy_cache api_cache;
  proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
  proxy_cache_valid 200 302 10m;
  proxy_cache_valid 404 502 503 504 500 1m;
  add_header X-Cache-Status $upstream_cache_status;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect off;
  proxy_buffering on;
  proxy_pass http://cmsgatewayapp;
  proxy_cookie_path ~^/.*$ /;

  location /api/firmware {

    proxy_cache_bypass $cookie_BRCMWASSOCookie;
    proxy_cache_bypass $cookie_BRCMAuthHeader;
    proxy_cache_bypass $cookie_BRCMportalCookie;
    proxy_cache_key $host$uri$is_args$args;
    proxy_cache api_cache;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 502 503 504 500 1m;
    add_header X-Cache-Status $upstream_cache_status;

    add_header default_type text/plain;
    add_header Content-Disposition "attachment";

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    proxy_buffering on;
    proxy_pass http://cmsgatewayapp;
    proxy_cookie_path ~^/.*$ /;
  }

}
location / {
     auth_basic "Restricted Content";
  auth_basic_user_file /etc/nginx/.htpasswd;
  #This  301 should be change when going live to https://www.broadcom.com#
  return 301 https://olden.aws.broadcom.com;

}

location ~ ^/(js/|css/|docs/|html-docs/) {

location ~ ^/docs/oscd {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization '';
    proxy_set_header Host avagodocs.s3-website-us-west-2.amazonaws.com;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-server-side-encryption;
    proxy_hide_header x-amz-server-side-encryption;
    proxy_hide_header Etag;
    proxy_hide_header Server;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
    add_header Content-Type "application/octet-stream";
    add_header X-Cache-Status $upstream_cache_status;
    rewrite ^/docs/(.*) /docs-and-downloads/$1  break;
    proxy_pass http://avagodocs.s3-website-us-west-2.amazonaws.com;
    break;
  }

  add_header Last-Modified $date_gmt;
  add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  if_modified_since off;
  expires off;
  etag off;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect off;
  proxy_buffering off;
  proxy_pass http://nodeapp;
  proxy_cookie_path ~^/.*$ /;

}
location ~ /robots.txt {

  set $envtype "prod";
  #  proxy_cache            s3_cache;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization '';
  #   proxy_set_header       Host ichabod-{{envtype}}-static.s3-website-us-east-1.amazonaws.com;
  #proxy_set_header Host ichabod-prod-static.s3-website-us-east-1.amazonaws.com;
  proxy_set_header Host ichabod-dr-static.s3-website-us-east-1.amazonaws.com;
  proxy_hide_header x-amz-id-2;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-meta-server-side-encryption;
  proxy_hide_header x-amz-server-side-encryption;
  proxy_hide_header Set-Cookie;
  proxy_ignore_headers Set-Cookie;
  proxy_cache_revalidate on;
  proxy_intercept_errors on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  add_header Cache-Control max-age=31536000;
  add_header X-Cache-Status $upstream_cache_status;

  #proxy_pass http://ichabod-prod-static.s3-website-us-west-2.amazonaws.com;
  proxy_pass http://ichabod-dr-static.s3-website-us-east-1.amazonaws.com;
}


