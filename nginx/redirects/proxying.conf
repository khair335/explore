location ~ /(wp-content/|json/) {

  set $envtype "dev";
  rewrite ^/media/ichabod-test/(.*) /broadcom-faceted-search?http_host=$http_host&host=$host&envtype=$envtype&newenvtype=${envtype} permanent;

  #  proxy_cache            s3_cache;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization '';
  #   proxy_set_header       Host ichabod-{{envtype}}-static.s3-website-us-east-1.amazonaws.com;
  #Note: BUCKETENV and REGION WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING values BASED ON ENVTYPE DURING RUNTIME
  # LOGIC IS PRESENT IN dynamic_proxy.sh
  proxy_set_header Host ichabod-BUCKETENV-static.s3-website-REGION.amazonaws.com;
  proxy_hide_header x-amz-id-2;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-meta-server-side-encryption;
  proxy_hide_header x-amz-server-side-encryption;
  proxy_hide_header Set-Cookie;
  proxy_ignore_headers Set-Cookie;
  proxy_cache_revalidate on;
  proxy_intercept_errors on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  #add_header Cache-Control max-age=31536000;
  proxy_hide_header X-Powered-By;
  proxy_hide_header etag;
  server_tokens off;
  #add_header X-Cache-Status $upstream_cache_status;
  add_header  Last-Modified  "";
  include /etc/nginx/redirects/general-security-header.conf;

  # s3 bucket dynamic setting
  #Note: BUCKETENV and REGION WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING values BASED ON ENVTYPE DURING RUNTIME
  # LOGIC IS PRESENT IN dynamic_proxy.sh
  proxy_pass http://ichabod-BUCKETENV-static.s3-website-REGION.amazonaws.com;

  if ($http_host = "localhost") {
    set $envtype "dev";
    proxy_pass http://ichabod-dev-static.s3-website-us-east-1.amazonaws.com;

  }

  # proxy_pass             http://ichabod-$envtype-static.s3-website-us-east-1.amazonaws.com;
  # proxy_pass             http://ichabod-qa-static.s3-website-us-east-1.amazonaws.com;
  # proxy_pass             http://ichabod-dev-static.s3-website-us-east-1.amazonaws.com;

}


