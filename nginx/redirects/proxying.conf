# Security center - symantec uploads

location ~ ^/(content/|security_center/|avcenter/) {

  include /etc/nginx/redirects/general-security-header.conf;
    #location ~* \.(?!(html|htm|xml)) {
     #   add_header Content-Type text/plain;
      #  add_header Content-Disposition "attachment";
    #}
  if ($request_uri ~* "([^/]*$)" ) {
    set  $fname  $1;
  }
  if ($request_uri ~* \.(?!(html|htm|xml))) {
    add_header Content-Disposition 'attachment; filename="$fname"';
  }
  #  proxy_cache            s3_cache;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization '';
  #   proxy_set_header       Host ichabod-{{envtype}}-static.s3-website-us-east-1.amazonaws.com;
  proxy_set_header Host symantec-uploads.s3-website-us-west-2.amazonaws.com;
  proxy_hide_header x-amz-id-2;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-meta-server-side-encryption;
  proxy_hide_header x-amz-server-side-encryption;
  proxy_hide_header Set-Cookie;
  proxy_ignore_headers Set-Cookie;
  proxy_cache_revalidate on;
  proxy_intercept_errors on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  proxy_hide_header X-Powered-By;
  server_tokens off;
  #add_header Cache-Control max-age=31536000;
  #add_header X-Cache-Status $upstream_cache_status;
  proxy_hide_header etag;
  add_header  last-modified  "";

    proxy_pass http://symantec-uploads.s3-website-us-west-2.amazonaws.com;

}

