location = /hc {

  proxy_set_header Host $http_host;
  auth_basic $hcAuthDynamic;
  auth_basic_user_file /etc/nginx/.htpasswd;
  proxy_set_header Authorization "Basic PLACEHOLDER";
  proxy_pass_header Authorization;
  #add_header ETag on;
  #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #proxy_redirect off;
  #proxy_buffering off;
  #proxy_hide_header X-Powered-By;
  server_tokens off;
  #include /etc/nginx/redirects/general-security-header.conf;
  #proxy_pass https://nodeapp;
  #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
  # LOGIC IS PRESENT IN dynamic_proxy.sh
  proxy_pass https://PROXY_API_DEST.aws.broadcom.com;

}

#Added Proxy for Partner Locator from Channel Mechanics
location /how-to-buy/partner-distributor-lookup {
        proxy_pass https://CMURL.locator.citplatform.com/how-to-buy/partner-distributor-lookup;
  }


location ~ ^/(gallery|api) {

  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;
  server_tokens off;

  if_modified_since off;
  add_header  Last-Modified  "";
  expires off;
  proxy_hide_header etag;
  #etag off;
  add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  proxy_hide_header expires;

  include /etc/nginx/redirects/general-security-header.conf;

  proxy_set_header Authorization "Basic PLACEHOLDER";
  proxy_pass_header Authorization;

  location ~ ^/api/tools {

    proxy_hide_header x-cache-status;
    include /etc/nginx/redirects/general-security-header.conf;
   # proxy_set_header Host dev-api.aws.broadcom.com;
   # add_header X-Robots-Tag $robots;
    proxy_set_header Host $http_host;
    include /etc/nginx/redirects/proxying_api_nav_cache.conf;
    return 302 https://www.broadcom.com;
    #proxy_pass https://cmsgatewayapp;
    break;

  }

  location ~ ^/api/navigation {

    proxy_hide_header x-cache-status;
    include /etc/nginx/redirects/general-security-header.conf;
   # proxy_set_header Host dev-api.aws.broadcom.com;
   # add_header X-Robots-Tag $robots;
    proxy_set_header Host $http_host;
    include /etc/nginx/redirects/proxying_api_nav_cache.conf;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    #proxy_pass https://cmsgatewayapp;
    break;

  }


  location ~ ^/api/getmetadata {

    include /etc/nginx/redirects/general-security-header.conf;

    # DONT COMMIT THIS HEADER TO PRODUTION. HIGHLY RESTRITCTED.
    #add_header X-Robots-Tag $robots;

    include /etc/nginx/redirects/proxying_api_metadata_cache.conf;

    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

  location ~ ^/api/v2/getpubdate {

    include /etc/nginx/redirects/general-security-header.conf;

    proxy_set_header Host $http_host;
    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

   location ~ ^/api/v2/getmetadata {

    include /etc/nginx/redirects/general-security-header.conf;

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
     proxy_set_header Host $http_host;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

   location ~ ^/api/getjson {

    include /etc/nginx/redirects/general-security-header.conf;
    set $nocache 0;

    if ($query_string ~ "mybroadcom"){
        set $nocache 1;
    }

    if ($query_string ~ "tnc"){
        set $nocache 1;
    }

    if ($query_string ~ "no_cache"){
        set $nocache 1;
    }

#     if ($query_string !~ "mybroadcom"){
#         set $nocache 0;
#     }

    if ($query_string ~ "docs-alert-subscribe-thankyou"){
        set $nocache 1;
    }

#     if ($query_string !~ "docs-alert-subscribe-thankyou"){
#         set $nocache 0;
#     }
    if ($arg_url = "docs-alert-subscribe-thankyou"){
        set $nocache 1;
    }

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_set_header Host $http_host;
    include /etc/nginx/redirects/proxying_api.conf;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }
  location ~ ^/api/service {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_set_header Host $http_host;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

  location ~ ^/api/news {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_set_header Host $http_host;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

  location ~ ^/api/nocache {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api_no_cache.conf;

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_set_header Host $http_host;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

  location ~ ^/api/cache {

    include /etc/nginx/redirects/general-security-header.conf;
    include /etc/nginx/redirects/proxying_api.conf;

    #Note: PROXY_API_DEST WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING DOMAIN BASED ON ENVTYPE DURING RUNTIME
    # LOGIC IS PRESENT IN dynamic_proxy.sh
    proxy_set_header Host $http_host;
    proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
    break;

  }

 # BCCS10-5 Brightedge API Integration for SEO Parameter Updates
location ~ /api/ixf/1.0.0/get_capsule/f00000000037426/global.json {
set $envtype "dev";

  #  proxy_cache            s3_cache;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization '';
  # LOGIC IS PRESENT IN dynamic_proxy.sh
  proxy_set_header Host api.brightedge.com;
  proxy_hide_header x-amz-id-2;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-meta-server-side-encryption;
  proxy_hide_header x-amz-server-side-encryption;
  proxy_hide_header Set-Cookie;
  proxy_ignore_headers Set-Cookie;
  proxy_cache_revalidate on;
  proxy_intercept_errors on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  proxy_hide_header X-Powered-By;
  server_tokens off;
  #add_header Cache-Control max-age=31536000;
  #add_header X-Cache-Status $upstream_cache_status;
  proxy_hide_header etag;
  add_header  last-modified  "";

  include /etc/nginx/redirects/general-security-header.conf;

  #Note: BUCKETENV and REGION WILL BE REPLACED DYNAMICALLY WITH CORRESPONDING values BASED ON ENVTYPE DURING RUNTIME
  # LOGIC IS PRESENT IN dynamic_proxy.sh
  proxy_pass https://api.brightedge.com;

  if ($http_host = "localhost") {
    set $envtype "dev";
    proxy_pass https://api.brightedge.com;

  }

}

