user www-data;
worker_processes 4;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 2048;
	multi_accept on;
}

http {
	#auth_basic "Restricted Content";
  	#auth_basic_user_file /etc/nginx/.htpasswd;
	##
	# Basic Settings
	##
    open_file_cache max=1024 inactive=10s;
    open_file_cache_valid 120s;
	
	client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
	
	client_body_buffer_size 128k;
    client_header_buffer_size 10k;
    large_client_header_buffers 4 4k;
	
	sendfile off;
	tcp_nopush off;
	tcp_nodelay off;
	#keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	server_names_hash_bucket_size 128;	
	server_names_hash_max_size 1024;



	#i server_name_in_redirect off;


	include /etc/nginx/mime.types;
	include /etc/nginx/brcm-cs-ui-servers.conf;
	include /etc/nginx/brcm-docs-servers.conf;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##
    log_format  main  '$http_x_forwarded_for ($remote_addr) - $remote_user '
                  '[$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" $request_time';
	#access_log /var/log/nginx/access.log;
	access_log /dev/stdout;
	error_log  /dev/stderr;
	#error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##
	
	gzip on;
	gzip_disable "msie6";
	gzip_vary off;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types application/javascript application/x-javascript font/opentype font/otf font/ttf image/svg+xml image/x-icon text/css text/javascript text/plain text/xml image/bmp image/png image/gif image/jpeg image/jpg application/json;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	#ID : 185025 - Disable Backtrace in Production
	proxy_intercept_errors on;
	error_page 500 502 503 504 /5XX-Error.html;

	server {
		server_name default_server;
		listen 443;
		listen [::]:443;
		ssl off;
		location / {
			proxy_hide_header X-Powered-By;
			proxy_hide_header Server;
 			server_tokens off;
			return 302 https://www.vmware.com;
		}
		location = /hc {
			proxy_set_header Host $http_host;
			add_header ETag on;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_redirect off;
			proxy_buffering off;
			proxy_hide_header X-Powered-By;
			server_tokens off;
			proxy_set_header Host $http_host;
  			proxy_set_header Authorization "Basic PLACEHOLDER";
  			proxy_pass_header Authorization;
			proxy_pass https://PROXY_API_DEST.aws.broadcom.com;

			#include /etc/nginx/common-proxy/*.conf;
			#proxy_pass $proxy_pass_variable;
			include /etc/nginx/redirects/general-security-header.conf;
		}
	}

	server {

		listen 80;
		listen [::]:80;
		server_name default_server;
  		location / {
			proxy_hide_header X-Powered-By;
			proxy_hide_header Server;
 			server_tokens off;
			return 302 https://www.vmware.com;
		}
		location = /hc {
			proxy_set_header Host $http_host;
			add_header ETag on;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_redirect off;
			proxy_buffering off;
			proxy_hide_header X-Powered-By;
			server_tokens off;
			#proxy_pass http://cmsgatewayapp;
			proxy_set_header Authorization "Basic PLACEHOLDER";
  			proxy_pass_header Authorization;
			proxy_pass https://PROXY_API_DEST.aws.broadcom.com;
			#include /etc/nginx/common-proxy/*.conf;
			#proxy_pass $proxy_pass_variable;
			include /etc/nginx/redirects/general-security-header.conf;
		}
	}
	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

