proxy_cache_path  /var/www/cache  levels=1:2    keys_zone=api_cache:10m inactive=24h  max_size=1g;
#daemon off;
server {
  client_max_body_size 4G;
# server_names_hash_bucket_size 64;
  #server_name cmsgatewayapp.com cmsgwdev2.aws.broadcom.com localhost cmsgw-dev-1797230968.us-east-1.elb.amazonaws.com *.amazonaws.com;

#include /etc/nginx/redirects/*.conf; 
    listen 443;
    listen [::]:443;
	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;

#	server_name _;
    error_log  /dev/stderr;
    access_log /dev/stdout;

	include /etc/nginx/redirects/proxying.conf;
}

upstream cmsgatewayapp {
  #server dev-api.aws.broadcom.com;
  server unix:/tmp/example_1.sock fail_timeout=0;
  server unix:/tmp/example_2.sock fail_timeout=0;
  server unix:/tmp/example_3.sock fail_timeout=0;
  server unix:/tmp/example_4.sock fail_timeout=0;
}

upstream nodeapp{
    server localhost:3000;
}
